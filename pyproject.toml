[project]
name = "iris-qa"
version = "0.1.0"
description = "Dataset-specific QA gate engine for Project IRIS geospatial layers"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
iris-qa = "iris_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dataset]
name = "peatland"
description = "Peat soil extents used as an environmental eligibility layer."
staging_table = "staging.peatland"
curated_table = "curated.peatland"
key = "peat_id"
countries = ["DE"]
regions = ["DE-NI"]

[geometry]
srid = 25832
types = ["POLYGON", "MULTIPOLYGON"]

[[checks]]
type = "required_fields"
fields = ["peat_id", "country_code", "region_code", "peat_class", "source_date", "geom"]

[[checks]]
type = "optional_fields"
fields = ["peat_depth_cm", "soil_organic_carbon_pct"]

[[checks]]
type = "key_uniqueness"
on_duplicate = "block"

[[checks]]
type = "geometry"

[[checks]]
type = "country_scope"

[[checks]]
type = "duplicate_rows"
columns = ["country_code", "geom"]

[[checks]]
id = "peat_class_domain"
type = "domain"
column = "peat_class"
allowed = ["bog", "fen", "transitional"]

[[checks]]
id = "soil_organic_carbon_range"
type = "domain"
column = "soil_organic_carbon_pct"
min = 0
max = 100

[[checks]]
type = "source_date"
max_age_days = 3650
